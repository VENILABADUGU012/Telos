name: telos
description: "TELOS - Personal Productivity, Track-Based Planning, Collaboration & AI Assistant"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_sign_in: ^6.2.2
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  fl_chart: ^0.69.2
  socket_io_client: ^3.0.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
